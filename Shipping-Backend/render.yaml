services:
  # 1. Django Web Service (API)
  - type: web
    name: longi-shipping-api
    plan: free
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn tracking_backend.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: longi-shipping-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromRedis:
          name: longi-shipping-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromRedis:
          name: longi-shipping-redis
          property: connectionString
      - key: SUPPORT_EMAIL
        value: "support@longi-shipping.com"
      - key: DEFAULT_FROM_EMAIL
        value: "noreply@longi-shipping.com"

  # 2. Celery Background Worker
  - type: worker
    name: longi-shipping-worker
    plan: free
    env: python
    buildCommand: ./build.sh
    startCommand: celery -A tracking_backend worker -l info
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: longi-shipping-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromRedis:
          name: longi-shipping-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromRedis:
          name: longi-shipping-redis
          property: connectionString
      - key: SUPPORT_EMAIL
        value: "support@longi-shipping.com"
      - key: DEFAULT_FROM_EMAIL
        value: "noreply@longi-shipping.com"

  # 3. Redis Instance (for Celery)
  - type: redis
    name: longi-shipping-redis
    plan: free
    ipAllowList: [] # Allow only internal private connections

# 4. PostgreSQL Database
databases:
  - name: longi-shipping-db
    plan: free
    databaseName: longi_shipping
    user: longi_shipping_user
